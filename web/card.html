<!doctype html>
<!--
  The card that goes on the table.

  It is not part of the wall: no script, no fetch, no state. It exists so the
  address is on paper, in a size a person can read from across a room, and so
  printing it is one Ctrl+P.

  Print a QR code for the URL with any generator (the URL is short, so even a
  small one scans from a phone at an arm's length) and tape it here:

      https://wall.hoa.family

  Why the page is served by the relay and not the wall: relay/README.md. The
  short version is that the wall is a laptop behind NAT, and a party's phones
  are not on its network.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draw on the wall</title>
<style>
  :root { --ink: #14121a; --accent: #ff3d81; }
  html, body { margin: 0; background: #f6f4f1; color: var(--ink); }
  body {
    font: 500 18px/1.35 system-ui, "Segoe UI", sans-serif;
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    width: min(100%, 460px);
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 18px;
    padding: 34px 30px 26px;
    text-align: center;
    box-shadow: 8px 8px 0 var(--ink);
  }
  .kicker {
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
  }
  h1 { font-size: 34px; line-height: 1.1; margin: 10px 0 4px; letter-spacing: -0.01em; }
  .sub { font-size: 16px; opacity: 0.72; margin: 0 0 22px; }
  .url {
    font: 700 clamp(20px, 6.4vw, 30px)/1.1 ui-monospace, "SFMono-Regular", Consolas, monospace;
    background: #14121a;
    color: #fff;
    padding: 14px 10px;
    border-radius: 10px;
    word-break: break-all;
  }
  .qr {
    margin: 22px auto 6px;
    width: 190px;
    height: 190px;
    border: 2px dashed rgba(0, 0, 0, 0.28);
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-size: 12px;
    line-height: 1.5;
    color: rgba(0, 0, 0, 0.5);
  }
  .foot { font-size: 12.5px; opacity: 0.6; margin-top: 18px; }
  @media print {
    body { padding: 0; background: #fff; }
    .card { box-shadow: none; width: 120mm; }
    /* The dashed box is where a printed QR goes; it must not print as a box. */
    .qr { border-color: transparent; }
    .qr span { display: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="kicker">the LED wall</div>
    <h1>Draw something.<br>It appears on the wall.</h1>
    <p class="sub">No app, no account. Twenty seconds, and it is up there.</p>

    <div class="url" id="addr">wall.hoa.family</div>

    <div class="qr"><span>print a QR code for<br>wall.hoa.family<br>and tape it here</span></div>

    <p class="foot">One drawing at a time, please — the wall takes its turns.
      Your drawing stays up until the owner clears the gallery.</p>
  </main>

  <script>
    // The address is the relay's, and the relay is the only thing a guest needs.
    // Read it from the page's own origin so the card cannot lie about where it
    // points: print this page from the machine that serves it, and the text on
    // the paper is the text the phone will reach.
    document.getElementById('addr').textContent = location.host || 'wall.hoa.family';
  </script>
</body>
</html>
