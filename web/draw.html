<!doctype html>
<!--
  draw.html - the 20x20 drawing app: anyone can draw, then send.

  One entry per drawing, no accounts, no moderation: this is a self-hosted
  family wall, so the entry flow is "open the page, draw, press send".

  The model is core/drawings.js (20x20 RGBA, alpha = "not used"), the same
  module the server store and the content renderer use - so what the editor
  holds is byte-for-byte what the wall paints. The editor paints a black
  background under the grid: transparent cells read as OFF, exactly as they
  will on the wall, and a black fill is a deliberate choice, not a surprise.

  The editing itself lives in web/draw-editor.js, shared with the guest page
  (public.html): one stroke implementation, one undo stack, one model, so the
  two pages cannot disagree about what a drawing is.

  Three exits:
    Send     -> POST /content {kind:'pic'}   show this drawing right now
    Save     -> POST /drawings               add it to the gallery the wall cycles
    Gallery  -> POST /content {kind:'gallery', interval}

  Removing an entry needs the owner token (X-Wall-Owner): the server prints it
  at startup and keeps it in data/owner-token.txt. The field below remembers it
  per browser, so the owner types it once. A guest page has no token and cannot
  prune anything - see web/public.html.

  Touch-first: the grid is a pointer-events surface with touch-action:none,
  so a phone draws with a finger and does not scroll the page mid-stroke.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Draw for the LED wall</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 12px; background: #0a0a0a; color: #ccc; font: 14px/1.5 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .hint { color: #888; max-width: 640px; }
  .wrap { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  #grid { display: block; width: min(92vw, 480px); height: min(92vw, 480px); background: #000;
          border: 1px solid #333; border-radius: 4px; touch-action: none; cursor: crosshair; }
  #preview { display: block; width: 160px; height: 160px; background: #000; border: 1px solid #333; border-radius: 4px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; padding: 8px 12px; background: #222; color: #ccc; border: 1px solid #444; border-radius: 6px; cursor: pointer; }
  button:hover { background: #333; }
  button.on { background: #264; border-color: #6fa; color: #eaffea; }
  button.big { padding: 10px 16px; font-size: 15px; }
  input[type=text] { font: inherit; padding: 8px; background: #111; color: #eee; border: 1px solid #444; border-radius: 6px; }
  input[type=number] { font: inherit; padding: 6px; width: 4.5em; background: #111; color: #eee; border: 1px solid #444; border-radius: 6px; }
  input[type=color] { width: 44px; height: 34px; padding: 0; background: #111; border: 1px solid #444; border-radius: 6px; }
  .swatch { width: 26px; height: 26px; padding: 0; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
  .swatch.on { outline: 2px solid #6fa; }
  #status { font-family: ui-monospace, monospace; color: #6f6; white-space: pre-wrap; }
  #status.bad { color: #f66; }
  label { color: #999; }
  .gallery { display: flex; flex-direction: column; gap: 4px; max-width: 480px; }
  .entry { display: flex; gap: 8px; align-items: center; }
  .entry canvas { width: 40px; height: 40px; background: #000; border: 1px solid #333; image-rendering: pixelated; }
  .entry .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry button { padding: 2px 8px; font-size: 12px; }
  code { color: #aaa; }
</style>
</head>
<body>
<h1>Draw for the wall</h1>
<p class="hint">
  20 × 20 — one square is one LED. Empty squares stay dark on the wall.
  Draw, then <b>Send</b> to show it now, or <b>Save</b> to add it to the
  gallery the wall cycles. <a href="./control.html">control</a> ·
  <a href="./content.html">content</a>
</p>

<div class="wrap">
  <canvas id="grid" width="640" height="640" aria-label="20 by 20 drawing grid"></canvas>

  <div class="col">
    <div class="row" id="tools">
      <button data-tool="pencil" class="on" type="button">Pencil</button>
      <button data-tool="eraser" type="button">Eraser</button>
      <button data-tool="fill" type="button">Fill</button>
    </div>

    <div class="row">
      <input id="color" type="color" value="#ff3355" aria-label="pick a color">
      <div class="row" id="palette"></div>
    </div>
    <div class="row" id="recent" aria-label="recently used colors"></div>

    <div class="row">
      <button id="undo" type="button">Undo</button>
      <button id="clear" type="button">Clear</button>
    </div>

    <div class="row">
      <button id="send" class="big on" type="button">Send to wall</button>
      <input id="name" type="text" size="12" maxlength="40" placeholder="name (optional)" spellcheck="false">
      <button id="save" class="big" type="button">Save to gallery</button>
    </div>

    <div class="row">
      <label>Gallery every <input id="interval" type="number" min="1" max="600" value="8"> s</label>
      <label>break <input id="gap" type="number" min="0" max="600" value="5"> s
        <select id="gapAnim"></select>
      </label>
      <label>transition <select id="trans"></select> <input id="transSec" type="number" min="0" max="30" value="1"> s
      </label>
      <button id="gallery" type="button">Start gallery</button>
    </div>

    <div class="col">
      <label>Wall preview (what the wall will show)</label>
      <canvas id="preview" width="20" height="20"></canvas>
    </div>

    <p><output id="status">ready</output></p>
  </div>
</div>

<div class="col">
  <label>Gallery (<span id="count">0</span>) — newest at the bottom, tap to show, ✕ to remove</label>
  <div class="row">
    <input id="owner" type="password" size="34" placeholder="owner token (server prints it at startup)" spellcheck="false" autocomplete="off">
  </div>
  <div class="gallery" id="entries"></div>
</div>

<script type="module">
import { GRID, pixelsToHex, pixelsFromHex } from '../core/drawings.js';
import { makeMessage, GAP_ANIM_NAMES, TRANSITION_NAMES, GALLERY_DEFAULTS } from '../core/content-protocol.js';
import { createEditor, flatPaint, DEFAULT_PALETTE, loadRecent, saveRecent } from './draw-editor.js';

const $ = (id) => document.getElementById(id);

// ---- the editor ------------------------------------------------------------
// The editor owns core's RGBA bytes; the page never keeps a parallel copy.
// Every render, every send and every save reads editor.pixels, so the wall
// cannot disagree with the screen about what was drawn.
const preview = $('preview');
const pctx = preview.getContext('2d');
preview.style.imageRendering = 'pixelated';

const editor = createEditor($('grid'), {
  cell: 32, // 20 * 32 = 640: the canvas is a 1:1 map of LED cells
  paint: flatPaint,
  onChange: (e) => renderPreview(e.pixels),
});

// The preview is the wall's own resolution (20x20) scaled up by CSS with
// pixelated rendering: the same "what the wall sees" check the content page
// does, without a round trip to the server.
function renderPreview(pixels) {
  pctx.clearRect(0, 0, GRID, GRID);
  const img = pctx.createImageData(GRID, GRID);
  img.data.set(pixels);
  pctx.putImageData(img, 0, 0);
}

$('undo').addEventListener('click', () => editor.undo());
$('clear').addEventListener('click', () => editor.clear());

for (const b of document.querySelectorAll('#tools button')) {
  b.addEventListener('click', () => {
    editor.setTool(b.dataset.tool);
    for (const o of document.querySelectorAll('#tools button')) o.classList.toggle('on', o === b);
  });
}

// ---- colors ----------------------------------------------------------------
// Full RGB via the native picker, plus a fixed quick palette for one-tap
// family drawing, plus the last colors used (localStorage, per device —
// there are no users here, so "recent" is whatever this phone drew with).
const RECENT_KEY = 'ledwall-draw-recent';
const RECENT_MAX = 10;
let recent = loadRecent(RECENT_KEY, RECENT_MAX);

// applyColor changes the working color only; setColor also commits it to the
// recents row. Dragging the native picker fires input continuously, and one
// drag would otherwise fill recents with every shade it passed through.
function applyColor(css) {
  if (!editor.setColor(css)) return false;
  $('color').value = editor.color;
  renderSwatches();
  return true;
}

function setColor(css) {
  if (!applyColor(css)) return;
  recent = [editor.color, ...recent.filter((c) => c !== editor.color)].slice(0, RECENT_MAX);
  saveRecent(RECENT_KEY, recent);
}

function renderSwatches() {
  const mk = (host, list) => {
    host.textContent = '';
    for (const c of list) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'swatch' + (c === editor.color ? ' on' : '');
      b.style.background = c;
      b.title = c;
      b.setAttribute('aria-label', `color ${c}`);
      b.addEventListener('click', () => setColor(c));
      host.appendChild(b);
    }
  };
  mk($('palette'), DEFAULT_PALETTE);
  mk($('recent'), recent);
}

$('color').addEventListener('input', () => applyColor($('color').value));
$('color').addEventListener('change', () => setColor($('color').value));

// ---- server actions --------------------------------------------------------
function set(text, ok = true) {
  const out = $('status');
  out.textContent = text;
  out.classList.toggle('bad', !ok);
}

async function post(url, body, type = 'application/json', headers = {}) {
  const r = await fetch(url, { method: 'POST', headers: { 'content-type': type, ...headers }, body });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r;
}

$('send').addEventListener('click', async () => {
  try {
    // The drawing rides in the message: showing a picture needs no server
    // state beyond the content channel every renderer already polls.
    await post('/content', JSON.stringify(makeMessage('pic', { pixels: pixelsToHex(editor.pixels) })));
    set('sent to the wall');
  } catch (err) {
    set(`send failed: ${err.message}`, false);
  }
});

$('save').addEventListener('click', async () => {
  try {
    // The owner token rides on the save: the post limit and the gallery cap are
    // guards for strangers, and an owner who has proven who they are is saving
    // a stack of pictures from one laptop, not flooding the wall.
    const r = await post('/drawings', JSON.stringify({ name: $('name').value, pixels: pixelsToHex(editor.pixels) }),
      'application/json', { 'x-wall-owner': ownerToken() });
    const j = await r.json();
    set(`saved: ${j.name || 'untitled'}`);
    $('name').value = '';
    loadGallery();
  } catch (err) {
    set(`save failed: ${err.message}`, false);
  }
});

// The break between drawings: an animation from the wall's own library, chosen
// from the same list the protocol validates (so this select can never offer a
// name the wall would refuse), and timed by the same server clock as the
// drawings - every renderer is in the break at the same second.
const gapAnim = $('gapAnim');
for (const name of GAP_ANIM_NAMES) {
  const o = document.createElement('option');
  o.value = name;
  o.textContent = name === 'none' ? 'dark' : name;
  gapAnim.append(o);
}
gapAnim.value = GALLERY_DEFAULTS.gapAnim;
const trans = $('trans');
for (const name of TRANSITION_NAMES) {
  const o = document.createElement('option');
  o.value = name;
  o.textContent = name === 'none' ? 'hard cut' : name;
  trans.append(o);
}
trans.value = GALLERY_DEFAULTS.transition;
$('transSec').value = String(GALLERY_DEFAULTS.transitionSec);
$('gap').value = String(GALLERY_DEFAULTS.gap);
$('interval').value = String(GALLERY_DEFAULTS.interval);

$('gallery').addEventListener('click', async () => {
  const interval = Math.max(1, Math.min(600, Number($('interval').value) || GALLERY_DEFAULTS.interval));
  const gap = Math.max(0, Math.min(600, Number($('gap').value) || 0));
  const anim = GAP_ANIM_NAMES.includes(gapAnim.value) ? gapAnim.value : 'none';
  const transition = TRANSITION_NAMES.includes(trans.value) ? trans.value : 'none';
  const transitionSec = Math.max(0, Math.min(30, Number($('transSec').value) || 0));
  $('interval').value = String(interval);
  $('gap').value = String(gap);
  $('transSec').value = String(transitionSec);
  try {
    await post('/content', JSON.stringify(makeMessage('gallery',
      { interval, gap, gapAnim: anim, transition, transitionSec })));
    set(`gallery: every ${interval} s${gap > 0 ? ` + ${gap} s of ${anim}` : ''}`
      + `${transitionSec > 0 ? ` · ${transition} ${transitionSec} s` : ''}`);
  } catch (err) {
    set(`gallery failed: ${err.message}`, false);
  }
});

// ---- the owner token -------------------------------------------------------
// The server gates DELETE: the owner token prunes the whole gallery, and the
// per-entry secret (served once to whoever posted it) opens one entry. This is
// the owner's page, so it uses the token, kept per browser in localStorage -
// typed once, and the server prints it on every start.
const OWNER_KEY = 'ledwall-owner-token';
function ownerToken() {
  try { return localStorage.getItem(OWNER_KEY) ?? ''; } catch { return $('owner').value; }
}
$('owner').value = ownerToken();
$('owner').addEventListener('input', () => {
  try { localStorage.setItem(OWNER_KEY, $('owner').value); } catch { /* private mode */ }
});

/** A refusal, in words the owner can act on. */
function deleteWhy(status) {
  if (status === 401) return 'owner token needed — the server prints it at startup';
  if (status === 403) return 'that is not the owner token';
  if (status === 404) return 'that drawing is already gone';
  return `HTTP ${status}`;
}

// ---- the gallery list ------------------------------------------------------
// Thumbnails are drawn from the stored bytes, not from a server-rendered
// image: the same pixels, the same core decoder, so a thumbnail that looks
// right IS a drawing that will look right on the wall.
async function loadGallery() {
  try {
    const r = await fetch('/drawings', { cache: 'no-store' });
    const metas = r.ok ? await r.json() : [];
    $('count').textContent = String(metas.length);
    const host = $('entries');
    host.textContent = '';
    for (const m of metas) {
      const row = document.createElement('div');
      row.className = 'entry';
      const thumb = document.createElement('canvas');
      thumb.width = GRID;
      thumb.height = GRID;
      const show = document.createElement('button');
      show.type = 'button';
      show.textContent = 'Show';
      show.addEventListener('click', async () => {
        try {
          const e = await (await fetch(`/drawings/${m.id}`, { cache: 'no-store' })).json();
          await post('/content', JSON.stringify(makeMessage('pic', { pixels: e.pixels })));
          set(`showing: ${m.name || 'untitled'}`);
        } catch (err) {
          set(`show failed: ${err.message}`, false);
        }
      });
      const del = document.createElement('button');
      del.type = 'button';
      del.textContent = '✕';
      del.title = 'remove';
      del.addEventListener('click', async () => {
        try {
          const r = await fetch(`/drawings/${m.id}`, {
            method: 'DELETE', headers: { 'x-wall-owner': ownerToken() },
          });
          if (!r.ok) { set(`remove: ${deleteWhy(r.status)}`, false); return; }
          set('removed');
          loadGallery();
        } catch (err) {
          set(`delete failed: ${err.message}`, false);
        }
      });
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = m.name || 'untitled';
      row.append(thumb, name, show, del);
      host.appendChild(row);
      // Pixels arrive per entry: 20x20 hex is ~3 KB, and a wall gallery is
      // dozens of entries, not thousands - fetching them together is fine.
      fetch(`/drawings/${m.id}`, { cache: 'no-store' })
        .then((rr) => (rr.ok ? rr.json() : null))
        .then((e) => {
          const bytes = e === null ? null : pixelsFromHex(e.pixels);
          if (bytes === null) return;
          const tctx = thumb.getContext('2d');
          const img = tctx.createImageData(GRID, GRID);
          img.data.set(bytes);
          tctx.putImageData(img, 0, 0);
        })
        .catch(() => {});
    }
  } catch {
    set('gallery list unavailable', false);
  }
}

renderSwatches();
loadGallery();
setInterval(loadGallery, 15000); // another tab may have saved while this one was open
</script>
</body>
</html>
