<!doctype html>
<!--
  public.html - the guest drawing page: draw, sign it, put it on the wall.

  Who this is for: anyone standing in front of the wall with a phone. No
  account, no instructions to read, nothing to learn. One thing is possible
  here, so the page shows one thing: the grid, the tools, one button.

  What this page CANNOT do is the point, and the import list is the boundary:
  no content-protocol.js, no WebSocket, no GET of anything. It writes exactly
  one request, POST /drawings, and it never reads the wall's state - a guest
  does not need to know what the wall is showing, and a page that reads
  /content every two seconds is a page with a polling loop to get wrong. The
  owner's editor is draw.html.

  The design is front-facing on purpose - this page is in a window:
    - the grid is painted as a lit LED matrix (dark gaps, glass highlights),
      because that is what the drawing is going to become;
    - the tools sit under the grid, in the thumb zone, as icons;
    - one verb, one button: "Put it on the wall", stuck to the bottom of the
      viewport on a phone;
    - the accent is the LED glow, and nothing else competes with it.

  The editing is web/draw-editor.js, shared with draw.html: one stroke, one
  undo stack, one model, so a drawing cannot mean two things.

  Anonymity has a price and it is recorded here: there is no account, so "who"
  is a name the visitor types and nobody checks. The save cooldown is per
  device and client-side - it slows one person down, it does not stop them. A
  wall handed out on this page needs the server to rate-limit, and the owner's
  editor is where the gallery gets pruned.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Draw on the wall</title>
<style>
  :root {
    color-scheme: dark;
    --glow: 255, 90, 140;          /* the LED accent; the page is lit by it */
    --ink: #f2f0ee;
    --dim: #a8a29e;
    --panel: #121013;
    --line: rgba(255, 255, 255, 0.10);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font: 15px/1.5 system-ui, "Segoe UI", sans-serif;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(var(--glow), 0.22), transparent 60%),
      radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.05) 1px, transparent 1.6px) 0 0 / 22px 22px,
      #0b0a0c;
    padding: max(20px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  .shell { max-width: 620px; margin: 0 auto; }

  h1 {
    text-align: center; font-size: clamp(30px, 8vw, 46px); line-height: 1.05;
    margin: 6px 0 18px; font-weight: 650; letter-spacing: -0.02em;
  }
  h1 em { font-style: normal; color: rgb(var(--glow)); text-shadow: 0 0 26px rgba(var(--glow), 0.55); }

  .card {
    background: linear-gradient(180deg, #17151a, var(--panel));
    border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  /* ---- the grid, framed like the panel it becomes ---- */
  .stage { padding: 16px; }
  .bezel {
    padding: 10px; border-radius: 14px; background: #000;
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.9), 0 0 40px rgba(var(--glow), 0.18);
  }
  #grid {
    display: block; margin: 0 auto; width: min(100%, 62vh); height: auto; aspect-ratio: 1 / 1;
    border-radius: 8px; touch-action: none; cursor: crosshair; background: #000;
  }
  .stage-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; color: var(--dim); font-size: 12px; }
  #cells { white-space: nowrap; font-variant-numeric: tabular-nums; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .tool {
    flex: 1 1 0; min-width: 52px; min-height: 52px; display: grid; place-items: center; gap: 2px;
    color: var(--ink); background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line);
    border-radius: 14px; cursor: pointer; font: inherit; padding: 6px 4px;
    transition: background 120ms, border-color 120ms, transform 80ms;
  }
  .tool svg { width: 22px; height: 22px; }
  .tool span { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); }
  .tool:hover { background: rgba(255, 255, 255, 0.09); }
  .tool:active { transform: scale(0.96); }
  .tool.on { background: rgba(var(--glow), 0.18); border-color: rgba(var(--glow), 0.7); box-shadow: 0 0 18px rgba(var(--glow), 0.25); }
  .tool.on span { color: rgb(var(--glow)); }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 4px 2px; }

  .colors { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .swatch {
    width: 34px; height: 34px; padding: 0; border-radius: 10px; cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.18); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
  }
  .swatch.on { outline: 2px solid rgb(var(--glow)); outline-offset: 2px; }
  .picker { position: relative; width: 34px; height: 34px; border-radius: 10px; overflow: hidden;
            border: 1px dashed rgba(255, 255, 255, 0.3); display: grid; place-items: center; color: var(--dim); font-size: 18px; }
  .picker input { position: absolute; inset: -6px; width: 150%; height: 150%; opacity: 0; cursor: pointer; border: 0; padding: 0; }

  /* ---- the one verb ---- */
  .cta { display: grid; gap: 10px; margin-top: 16px; }
  /* On a phone the verb lives in the thumb zone: it sticks to the bottom of
     the viewport while the grid scrolls under it, so the page never asks a
     guest to hunt for the button they just filled the screen drawing. */
  @media (max-width: 619px) {
    .cta {
      position: sticky; bottom: 0; z-index: 20; margin: 16px -16px -16px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(11, 10, 12, 0) 0%, rgba(11, 10, 12, 0.92) 26%, #0b0a0c 100%);
    }
  }
  .sign {
    width: 100%; padding: 13px 14px; border-radius: 12px; font: inherit; color: var(--ink);
    background: rgba(0, 0, 0, 0.45); border: 1px solid var(--line);
  }
  .sign::placeholder { color: #7d7873; }
  .sign:focus-visible, .tool:focus-visible, .swatch:focus-visible, .put:focus-visible, .again:focus-visible {
    outline: 2px solid rgb(var(--glow)); outline-offset: 2px;
  }
  .put {
    width: 100%; min-height: 58px; font: inherit; font-size: 18px; font-weight: 650; letter-spacing: 0.01em;
    color: #14101a; cursor: pointer; border: 0; border-radius: 14px; padding: 10px 18px;
    background: linear-gradient(180deg, #fff, rgb(var(--glow)));
    box-shadow: 0 10px 30px rgba(var(--glow), 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.7);
    transition: transform 80ms, filter 120ms;
  }
  .put:hover { filter: brightness(1.06); }
  .put:active { transform: translateY(1px) scale(0.995); }
  .put:disabled { cursor: not-allowed; filter: grayscale(0.7) brightness(0.55); box-shadow: none; }
  #status { margin: 2px 2px 0; font-size: 13px; color: rgba(var(--glow), 0.95); min-height: 1.2em; }
  #status.bad { color: #ff8a8a; }

  /* ---- the thank-you moment ---- */
  .overlay {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; z-index: 40;
    background: rgba(6, 5, 8, 0.82); backdrop-filter: blur(6px);
  }
  .overlay[hidden] { display: none; }
  .thanks { max-width: 340px; text-align: center; }
  .thanks canvas { width: min(260px, 70vw); height: min(260px, 70vw); image-rendering: pixelated; border-radius: 14px;
                   background: #000; border: 1px solid rgba(255, 255, 255, 0.16);
                   box-shadow: 0 0 60px rgba(var(--glow), 0.5); }
  .thanks h3 { font-size: 24px; margin: 16px 0 4px; }
  .thanks p { color: var(--dim); margin: 0 0 18px; }
  .again { font: inherit; font-size: 15px; padding: 12px 20px; border-radius: 12px; cursor: pointer;
           color: var(--ink); background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line); }
  .again:hover { background: rgba(255, 255, 255, 0.12); }
  @media (prefers-reduced-motion: reduce) { .tool, .put { transition: none; } }
</style>
</head>
<body>
<div class="shell">
  <h1>Draw on the <em>wall</em></h1>

  <section class="card stage">
    <div class="bezel"><canvas id="grid" width="640" height="640" aria-label="20 by 20 drawing grid"></canvas></div>
    <div class="stage-foot">
      <span>One square is one LED. Empty squares stay dark.</span>
      <span id="cells">0 / 400 lit</span>
    </div>

    <div class="toolbar" id="tools">
      <button class="tool on" data-tool="pencil" type="button" aria-label="pencil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg>
        <span>Pencil</span>
      </button>
      <button class="tool" data-tool="eraser" type="button" aria-label="eraser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20h11"/><path d="M12 7l5 5-6 6H8l-3-3z"/></svg>
        <span>Eraser</span>
      </button>
      <button class="tool" data-tool="fill" type="button" aria-label="fill an area">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l8-8 8 8-8 8-8-8z"/><path d="M20 14c1.2 1.7 1.8 2.6 1.8 3.5a1.8 1.8 0 1 1-3.6 0c0-.9.6-1.8 1.8-3.5z"/></svg>
        <span>Fill</span>
      </button>
      <div class="sep" aria-hidden="true"></div>
      <button class="tool" id="undo" type="button" aria-label="undo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h9a5 5 0 1 1 0 10H8"/><path d="M4 11l4-4M4 11l4 4"/></svg>
        <span>Undo</span>
      </button>
      <button class="tool" id="clear" type="button" aria-label="clear the grid">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>
        <span>Clear</span>
      </button>
    </div>

    <div class="colors" id="palette"></div>
    <div class="colors" id="recent" aria-label="recently used colors"></div>

    <div class="cta">
      <input id="name" class="sign" type="text" maxlength="40" placeholder="Sign it (optional)" spellcheck="false" aria-label="your name, shown on the wall next to the drawing">
      <button id="save" class="put" type="button" disabled>Put it on the wall</button>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
  </section>
</div>

<div class="overlay" id="thanks" hidden>
  <div class="thanks">
    <canvas id="thanksArt" width="20" height="20"></canvas>
    <h3 id="thanksTitle">That's on the wall</h3>
    <p id="thanksNote">It joins the gallery in a moment.</p>
    <button class="again" id="again" type="button">Draw another</button>
  </div>
</div>

<script type="module">
import { GRID, pixelsToHex } from '../core/drawings.js';
import { createEditor, DEFAULT_PALETTE, loadRecent, saveRecent } from './draw-editor.js';

const $ = (id) => document.getElementById(id);
const CELLS = GRID * GRID;

// A per-device pause between saves, declared before the editor: the editor's
// onChange runs during createEditor's first render, and it reads this, so a
// `let` below would be in its temporal dead zone at that moment - the whole
// module script dies and the page is a black grid.
// It is client-side, and it is honest about being client-side: it stops one
// excited person filling the gallery, and it is not a security boundary. The
// server is where a real limit belongs.
const COOLDOWN_MS = 20_000;
let lastSaveAt = 0;
function cooldownLeft() { return Math.max(0, COOLDOWN_MS - (Date.now() - lastSaveAt)); }

// ---- the editor, painted as a lit LED matrix -------------------------------
// A guest should see what the drawing is going to become, so the grid is not
// graph paper: cells are round LEDs with dark gaps and a glass highlight, and
// an UNUSED cell is a dim dead LED - which is exactly the wall's off state,
// not a white box waiting to be filled.
function ledPaint(ctx, pixels, { cell, size }) {
  ctx.fillStyle = '#050406';
  ctx.fillRect(0, 0, size, size);
  const r = cell * 0.42;
  const gap = cell * 0.08;
  for (let i = 0; i < CELLS; i++) {
    const x = (i % GRID) * cell;
    const y = ((i / GRID) | 0) * cell;
    const a = pixels[i * 4 + 3];
    if (a === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.045)';
      ctx.beginPath(); ctx.arc(x + cell / 2, y + cell / 2, r * 0.8, 0, Math.PI * 2); ctx.fill();
      continue;
    }
    const rgb = `${pixels[i * 4]},${pixels[i * 4 + 1]},${pixels[i * 4 + 2]}`;
    ctx.fillStyle = `rgba(${rgb},${(a / 255).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(x + cell / 2, y + cell / 2, r, 0, Math.PI * 2); ctx.fill();
    // The highlight is a fixed alpha, not a computed lighter color: it reads
    // as the bead's epoxy dome on any hue, and costs one arc per cell.
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath(); ctx.arc(x + cell * 0.42, y + cell * 0.40, r * 0.34, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = gap;
    ctx.beginPath(); ctx.arc(x + cell / 2, y + cell / 2, r, 0, Math.PI * 2); ctx.stroke();
  }
}

const editor = createEditor($('grid'), {
  cell: 32, // 20 * 32 = 640: the canvas is a 1:1 map of LED cells
  paint: ledPaint,
  onChange: (e) => {
    $('save').disabled = e.isEmpty() || cooldownLeft() > 0;
    let lit = 0;
    for (let i = 3; i < e.pixels.length; i += 4) if (e.pixels[i] !== 0) lit++;
    $('cells').textContent = `${lit} / ${CELLS} lit`;
  },
});

$('undo').addEventListener('click', () => editor.undo());
$('clear').addEventListener('click', () => editor.clear());
for (const b of document.querySelectorAll('#tools [data-tool]')) {
  b.addEventListener('click', () => {
    editor.setTool(b.dataset.tool);
    for (const o of document.querySelectorAll('#tools [data-tool]')) o.classList.toggle('on', o === b);
  });
}

// ---- colors ----------------------------------------------------------------
const RECENT_KEY = 'ledwall-public-recent';
const RECENT_MAX = 8;
let recent = loadRecent(RECENT_KEY, RECENT_MAX);

// applyColor changes the working color; setColor also commits it to recents.
// The native picker fires input continuously while it is dragged, and one
// drag would otherwise fill recents with every shade it passed through.
function applyColor(css) {
  if (!editor.setColor(css)) return false;
  renderSwatches();
  return true;
}
function setColor(css) {
  if (!applyColor(css)) return;
  recent = [editor.color, ...recent.filter((c) => c !== editor.color)].slice(0, RECENT_MAX);
  saveRecent(RECENT_KEY, recent);
}

function renderSwatches() {
  const mk = (host, list) => {
    host.textContent = '';
    for (const c of list) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'swatch' + (c === editor.color ? ' on' : '');
      b.style.background = c;
      b.title = c;
      b.setAttribute('aria-label', `color ${c}`);
      b.addEventListener('click', () => setColor(c));
      host.appendChild(b);
    }
  };
  mk($('palette'), DEFAULT_PALETTE);
  const picker = document.createElement('label');
  picker.className = 'picker';
  picker.title = 'any color';
  picker.textContent = '+';
  const input = document.createElement('input');
  input.type = 'color';
  input.value = editor.color;
  input.setAttribute('aria-label', 'pick any color');
  input.addEventListener('input', () => applyColor(input.value));
  input.addEventListener('change', () => setColor(input.value));
  picker.appendChild(input);
  $('palette').appendChild(picker);
  mk($('recent'), recent);
}

// ---- the one verb ----------------------------------------------------------
function set(text, ok = true) {
  $('status').textContent = text;
  $('status').classList.toggle('bad', !ok);
}

$('save').addEventListener('click', async () => {
  const left = cooldownLeft();
  if (editor.isEmpty()) { set('Draw something first.'); return; }
  if (left > 0) { set(`One at a time - ${Math.ceil(left / 1000)} s.`); return; }
  $('save').disabled = true;
  try {
    const r = await fetch('/drawings', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ name: $('name').value, pixels: pixelsToHex(editor.pixels) }),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    lastSaveAt = Date.now();
    showThanks(j.name || 'unsigned');
    editor.clear();
    $('name').value = '';
    set('on the wall');
  } catch (err) {
    set(`the wall did not take it: ${err.message}`, false);
    $('save').disabled = false;
  }
});

const thanksArt = $('thanksArt').getContext('2d');
function showThanks(name) {
  // The bytes are copied before the canvas is cleared: the thank-you card
  // shows the drawing that was just saved, not the empty grid it became.
  const saved = editor.pixels.slice();
  thanksArt.clearRect(0, 0, GRID, GRID);
  const img = thanksArt.createImageData(GRID, GRID);
  img.data.set(saved);
  thanksArt.putImageData(img, 0, 0);
  $('thanksTitle').textContent = name === 'unsigned' ? "That's on the wall" : `Thanks, ${name}`;
  $('thanks').hidden = false;
}
$('again').addEventListener('click', () => { $('thanks').hidden = true; $('grid').focus({ preventScroll: true }); });
$('thanks').addEventListener('click', (ev) => { if (ev.target === $('thanks')) $('thanks').hidden = true; });

// The cooldown label is the only thing on a timer: with no wall panel to
// poll, this page has no polling loop at all.
setInterval(() => {
  const left = cooldownLeft();
  if (left > 0) {
    $('save').disabled = true;
    $('save').textContent = `Next one in ${Math.ceil(left / 1000)} s`;
  } else if ($('save').textContent.startsWith('Next one')) {
    $('save').textContent = 'Put it on the wall';
    $('save').disabled = editor.isEmpty();
  }
}, 250);

renderSwatches();
</script>
</body>
</html>
