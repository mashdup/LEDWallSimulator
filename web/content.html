<!doctype html>
<!--
  content.html - the wall's content, rendered from server state.

  This page is a pure renderer: it polls GET /content (state + serverTime)
  and draws. It owns no animation of its own - every phase, position, and
  pass is derived from the SERVER clock, so every instance of this page
  (a human's tab, the control page, and the headless capture browser the
  wall photographs) shows the identical frame at the same moment. That is
  the only design that survives the pipeline's real topology: the capture
  browser is a separate instance that loads this page fresh on every
  shot, shares nothing with any tab, and restarts from zero each time.

  Commands come from POST /content (see web/control.html); the protocol
  lives in core/content-protocol.js. ?wall=1 hides the human panel so the
  page is exactly 400x400 - a page taller than the capture viewport gets
  shot as a scaled full-page image, and panel text bleeds into the wall.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>LED wall content</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #000; color: #ccc; font: 14px/1.5 system-ui, sans-serif; }
  canvas { display: block; width: 400px; height: 400px; image-rendering: pixelated; }
  #panel { padding: 12px 16px; max-width: 620px; }
  #status { font-family: ui-monospace, monospace; color: #6f6; }
  .hint { color: #888; }
  code { color: #aaa; }
  @media (max-width: 640px) { canvas { width: 100vw; height: 100vw; } }
</style>
<script>
  // ?wall=1: the capture viewport. Hide everything but the canvas so the
  // page is exactly 400x400 and the shot is 1:1 with the LED grid.
  if (new URL(location.href).searchParams.get('wall') === '1') {
    document.documentElement.style.setProperty('--panel-display', 'none');
    addEventListener('DOMContentLoaded', () => {
      const p = document.getElementById('panel');
      if (p) p.style.display = 'none';
    });
  }
</script>
</head>
<body>
<canvas id="wall" width="400" height="400"></canvas>
<div id="panel">
  <h2>LED wall content</h2>
  <p class="hint">
    This page renders the server's content state (GET /content) and syncs to
    the server clock. Open <a href="./control.html">control.html</a> to drive
    it, or POST protocol messages to <code>/content</code>. Every instance of
    this page - including the wall's capture browser - shows the same frame.
  </p>
  <p><output id="status">connecting…</output></p>
</div>

<script type="module">
import { createClock } from './worker-clock.js';
import { startKeepAlive } from './keep-alive.js';
import { Panel, Scroller } from '../core/index.js';
import { GRID, pixelsFromHex } from '../core/drawings.js';
import { gallerySlot } from '../core/content-protocol.js';
import { animFrame } from '../core/animations.js';
import { applyTransition } from '../core/transitions.js';
import { Banner } from './banner.js';
/*
 * WALL — the drawing API for this page's canvas, sized to the panel.
 *
 * The wall is a 20x20 grid; the canvas is 400x400 css px, so one LED is one
 * 20x20 block. Draw pixel-aligned to the block grid and the capture's
 * area-average is exact: no blur, no rounding, what you set is what lights.
 */
const WALL = (() => {
  const canvas = document.getElementById('wall');
  const ctx = canvas.getContext('2d', { alpha: true });
  const grid = 20;
  const cell = canvas.width / grid;

  function cellRect(x, y) {
    return [x * cell, y * cell, cell, cell];
  }
  return {
    grid,
    cell,
    canvas,
    ctx,
    set(x, y, css) {
      if (x < 0 || y < 0 || x >= grid || y >= grid) return;
      ctx.fillStyle = css;
      ctx.fillRect(...cellRect(x, y));
    },
    rect(x, y, w, h, css) {
      ctx.fillStyle = css;
      for (let j = 0; j < h; j++) {
        for (let i = 0; i < w; i++) {
          if (x + i < 0 || y + j < 0 || x + i >= grid || y + j >= grid) continue;
          ctx.fillRect(...cellRect(x + i, y + j));
        }
      }
    },
    clear() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    },
  };
})();

// ---- server-synced state ---------------------------------------------------
// The single source of truth is the server: state + its clock. Renderers poll,
// derive every phase from serverTime, and draw. No local animation clocks, no
// cross-tab channels - the capture browser cannot share anything with a tab,
// and a page that animates from its own load time is a page the wall can
// never catch (each capture is a fresh instance at t=0).

let state = { v: 1, kind: 'demo' };
let rev = -1;
let serverAt = Date.now();
let localAt = performance.now();

function serverNow() {
  // Server time extrapolated by the local monotonic clock between polls:
  // smooth between polls, corrected at every poll.
  return serverAt + (performance.now() - localAt);
}

async function poll() {
  try {
    const r = await fetch('/content', { cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    serverAt = j.at;
    localAt = performance.now();
    if (j.rev !== rev) {
      rev = j.rev;
      state = j.state;
      onState();
    }
  } catch {
    // Server down: keep the last state and keep drawing. A wall that holds
    // its last frame beats a wall that goes dark when a dev server restarts.
  }
}
setInterval(poll, 100);
poll();

// Text state builds the app's own banner pipeline once per rev: Banner
// renders the copy to a bitmap (the fallback IS the text - refresh() is
// never called), Scroller owns the geometry, and the draw loop seeks it to
// the phase the server clock implies. passMs is one full pass, so the
// banner's position is a pure function of server time: every instance,
// including a freshly loaded capture page, lands on the same frame.
const panel = new Panel();
let scroller = null;
let passMs = 0;

function onState() {
  scroller = null;
  if (state.kind === 'text') {
    const src = new Banner({ fallback: state.text, color: state.color ?? '#ffffff' });
    scroller = new Scroller({
      panel,
      source: src.bitmap(),
      cellsPerFrame: state.step ?? 1,
      direction: -1,
    });
    passMs = scroller.passDurationMs(30);
  }
  // Entering the gallery: pull the list now, do not wait out the 2 s refresh
  // window, so the first drawing appears within one poll of the command.
  if (state.kind === 'gallery') galleryRefresh(true);
  setOutput(describe());
}

function describe() {
  if (state.kind === 'text') return `rev ${rev} · text: ${state.text.slice(0, 32)}`;
  if (state.kind === 'anim') return `rev ${rev} · ${state.name}`;
  if (state.kind === 'pic') return `rev ${rev} · pic`;
  if (state.kind === 'gallery') return `rev ${rev} · gallery`;
  return `rev ${rev} · ${state.kind}`;
}

// ---- the renderer: draw(state, serverTime), nothing else --------------------

const clock = createClock(33).start(); // ~30 fps
let lastTick = performance.now();
clock.onTick = () => {
  // Chrome throttles hidden tabs (and their workers) to ~1 Hz; say so on the
  // page instead of letting the wall silently freeze. The first click here
  // starts the silent-audio keep-alive, which lifts the throttling.
  const now = performance.now();
  if (now - lastTick > 500 && document.hidden) {
    setOutput('THROTTLED (hidden tab): click this page, keep it visible');
  }
  lastTick = now;
  draw();
  pushFrame();
};

// Push the canvas to the server after every draw: the wall fetches the
// latest frame in milliseconds, instead of paying a 60-90 ms headless
// photograph per update. The in-flight guard is the throttle: a push that
// has not landed yet drops this frame, so a slow encode lowers the rate
// instead of queueing latency. Fire-and-forget: a dropped push is one
// skipped frame, never a stalled renderer.
//
// The pushed frame is a 20x20 snapshot, not the 400x400 canvas: that IS
// the wall's resolution. Encoding 400x400 (PNG ~100 ms, JPEG ~90 ms in
// headless) caps the push near 10 fps; 20x20 PNG encodes in ~1 ms and
// the push runs at the full 30 fps - and PNG is lossless, which matters:
// JPEG's 8x8 blocks are 40% of a 20x20 frame each, so its artifacts land
// directly on LED cells. The app's auto-zoom fits any source size to the
// grid, so a 20x20 source maps 1:1 with zero pan math.
let pushing = false;
const pushCanvas = document.createElement('canvas');
pushCanvas.width = WALL.grid;
pushCanvas.height = WALL.grid;
const pushCtx = pushCanvas.getContext('2d');

function pushFrame() {
  if (pushing) return;
  pushing = true;
  // Clear before drawing: drawImage composites, it does not replace, so a
  // transparent source region leaves the PREVIOUS frame's pixels behind. On a
  // page canvas that is invisible (WALL.canvas is cleared every tick), but the
  // push canvas is shared - without this, a cell that turns off stays lit in
  // the feed the wall reads, and the wall ghosts every pattern it has ever
  // shown.
  pushCtx.clearRect(0, 0, pushCanvas.width, pushCanvas.height);
  pushCtx.drawImage(WALL.canvas, 0, 0, WALL.grid, WALL.grid);
  pushCanvas.toBlob((blob) => {
    if (blob === null) {
      pushing = false;
      return;
    }
    fetch('/content/frame', {
      method: 'POST',
      headers: { 'content-type': 'image/png' },
      body: blob,
    }).catch(() => {}).then(() => { pushing = false; });
  }, 'image/png');
}

function draw() {
  const t = serverNow() / 1000;
  switch (state.kind) {
    case 'demo':
    case 'anim':
      animDraw(state.kind === 'demo' ? 'demo' : state.name, t);
      break;
    case 'clear':
      WALL.clear();
      break;
    case 'fill':
      WALL.clear();
      WALL.rect(0, 0, WALL.grid, WALL.grid, state.color);
      break;
    case 'rect':
      WALL.clear();
      WALL.rect(state.x, state.y, state.w, state.h, state.color);
      break;
    case 'pic':
      // One user drawing, straight off the wire: the editor posts the hex
      // grid in the message, so a picture needs no server-side gallery.
      WALL.clear();
      paintPixels(state.pixels);
      break;
    case 'gallery':
      galleryDraw(t);
      break;
    case 'text': {
      if (scroller === null) return;
      // The banner's position is a pure function of server time: seek to the
      // phase of the current pass, render, paint. No local advance.
      // seek() wants a CELL offset in [0, period) - the pass fraction must
      // be multiplied by the period (feeding the 0..1 fraction in directly
      // parks the text under 1 cell from the start: visible, stone still).
      scroller.seek((((t * 1000) % passMs) / passMs) * scroller.period);
      scroller.render(panel);
      paintBytes(panel.pixels);
      break;
    }
  }
}

// ---- the animation library -------------------------------------------------
// This IS the library, not a copy of it: every frame comes from the same
// pure generator (core/animations.js) that the app tab's frame driver runs,
// painted with the same paintBytes the gallery path already used. What this
// page shows and what the wall lights are the same bytes BY CONSTRUCTION.
//
// The canvas-side copy of the whole animation switch that lived here was a
// standing invitation to drift from core in silence: no test compared the
// two renderers, so any of them could paint a frame the other would not.
// That is exactly the shape of bug a field report like 'the sky flickers
// pink to blue' needs to exist. One library, one paint path, no drift.
//
// t is server time in seconds. core's animFrame wraps the epoch into one
// hour of phase itself (the quantization-jitter fix), and 'clock' is the
// one animation that reads the raw epoch - handled there, not here.

function animDraw(name, tRaw) {
  paintBytes(animFrame({ kind: 'anim', name }, tRaw, WALL.grid));
}

// ---- user drawings ---------------------------------------------------------
// A drawing is the 20x20 RGBA grid core/drawings.js defines, carried as hex.
// Alpha is the whole transparency story: a=0 means "not used", so it is
// skipped and the wall's black shows through - which is also why the editor
// page paints a black background: what looks empty there is off on the wall.

function paintPixels(hex) {
  const bytes = pixelsFromHex(hex);
  if (bytes === null) return; // never drawn on a legal message; belt and braces
  const ctx = WALL.ctx;
  for (let i = 0; i < GRID * GRID; i++) {
    const a = bytes[i * 4 + 3];
    if (a === 0) continue;
    const r = bytes[i * 4];
    const g = bytes[i * 4 + 1];
    const b = bytes[i * 4 + 2];
    ctx.fillStyle = a === 255 ? `rgb(${r},${g},${b})` : `rgba(${r},${g},${b},${(a / 255).toFixed(3)})`;
    ctx.fillRect((i % GRID) * WALL.cell, ((i / GRID) | 0) * WALL.cell, WALL.cell, WALL.cell);
  }
}

// The gallery: the entries live on the server (GET /drawings), and WHICH
// one is showing is a pure function of the shared server clock (gallerySlot,
// in core) - so the wall, a human's tab, and a capture browser that loads
// fresh mid-cycle all land on the same drawing, and on the same break between
// drawings. The cache is by id, so a new entry never shifts the pixels an id
// maps to.
const gallery = { metas: [], fetchedAt: 0, cache: new Map(), inflight: null, pending: new Set(), label: '' };

async function galleryRefresh(force = false) {
  if (gallery.inflight !== null) return gallery.inflight;
  if (!force && Date.now() - gallery.fetchedAt < 2000) return;
  gallery.inflight = fetch('/drawings', { cache: 'no-store' })
    .then((r) => (r.ok ? r.json() : []))
    .then((metas) => {
      gallery.metas = Array.isArray(metas) ? metas : [];
      gallery.fetchedAt = Date.now();
    }, () => {
      // Server down: keep cycling the list we already have.
    })
    .then(() => { gallery.inflight = null; });
  return gallery.inflight;
}

function gallerySlotNow(t) {
  return gallerySlot(t, gallery.metas.length, state.interval ?? 5, state.gap ?? 0,
    state.gapAnim ?? 'none', state.transitionSec ?? 0);
}

/**
 * The flat RGB bytes of one slot: a drawing off the wire, a break animation,
 * or dark. From core, in this renderer as in the app tab - the gallery is
 * composed from the pure generator in BOTH renderers, so the capture browser
 * and the frame driver cannot drift, and a transition has two frames of the
 * same origin to blend.
 */
function slotBytes(slot, t) {
  if (slot.anim !== null) return animFrame({ kind: 'anim', name: slot.anim }, t);
  if (slot.drawing < 0) return new Uint8Array(GRID * GRID * 3);
  const meta = gallery.metas[slot.drawing];
  const hex = gallery.cache.get(meta.id);
  if (hex === undefined) {
    galleryFetch(meta.id);
    return new Uint8Array(GRID * GRID * 3); // dark this tick; the pixels land on the next one
  }
  return animFrame({ kind: 'pic', pixels: hex }, t);
}

function galleryDraw(t) {
  galleryRefresh(); // self-throttled: one list fetch per 2 s, one in flight
  const slot = gallerySlotNow(t);
  let bytes = slotBytes(slot, t);
  // The transition into this slot: the previous slot's frame, at the SAME
  // clock, blended by the same k every other renderer computes. The animation
  // keeps running through the blend (its frame is taken at t, not at the slot
  // boundary), so a wipe into a break animation is a wipe of a moving picture.
  if (slot.from !== null) {
    bytes = applyTransition(state.transition ?? 'none', slotBytes(slot.from, t), bytes, slot.k);
  }
  paintBytes(bytes);

  const label = slot.drawing >= 0
    ? `gallery ${slot.drawing + 1}/${gallery.metas.length}${gallery.metas[slot.drawing]?.name
      ? ' · ' + gallery.metas[slot.drawing].name : ''}`
    : slot.anim !== null
      ? `gallery break · ${slot.anim}`
      : gallery.metas.length === 0 ? 'gallery: empty' : 'gallery break · dark';
  if (label !== gallery.label) {
    gallery.label = label;
    setOutput(label);
  }
}

function galleryFetch(id) {
  if (gallery.cache.has(id) || gallery.pending.has(id)) return;
  gallery.pending.add(id);
  fetch(`/drawings/${id}`, { cache: 'no-store' })
    .then((r) => (r.ok ? r.json() : null))
    .then((e) => {
      if (e !== null && typeof e.pixels === 'string') gallery.cache.set(id, e.pixels);
    }, () => {
      /* not cached: the next draw retries */
    })
    .then(() => { gallery.pending.delete(id); });
}

// The panel's flat RGB bytes -> the canvas, one fillRect per lit cell.
function paintBytes(bytes) {
  WALL.clear();
  for (let i = 0; i < WALL.grid * WALL.grid; i++) {
    const r = bytes[i * 3];
    const g = bytes[i * 3 + 1];
    const b = bytes[i * 3 + 2];
    if (r === 0 && g === 0 && b === 0) continue;
    const x = i % WALL.grid;
    const y = (i / WALL.grid) | 0;
    WALL.ctx.fillStyle = `rgb(${r},${g},${b})`;
    WALL.ctx.fillRect(x * WALL.cell, y * WALL.cell, WALL.cell, WALL.cell);
  }
}

// Chrome throttles hidden tabs (and their workers) to ~1 Hz; the audio
// exemption is the in-page escape, and any click grants it.
addEventListener('pointerdown', () => startKeepAlive(), { once: true });

function setOutput(text) {
  document.getElementById('status').textContent = text;
}

// Exposed for the console: WALL.applyMessage({v:1,kind:'fill',color:'red'})
// publishes straight to the server - the same path the control page uses.
WALL.applyMessage = async (m) => {
  const r = await fetch('/content', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(m),
  });
  return r.status;
};
window.WALL = WALL;

setOutput('demo'); // proof of a live module: the dump-dom test asserts on this
</script>
</body>
</html>
