# Ship the binaries for every platform.
#
# Triggers: pushing a version tag (v1.2.3...) publishes a GitHub Release with
# all artifacts attached; the Actions tab's "Run workflow" button builds
# artifacts for testing without a release.
#
# Why a matrix: macOS binaries can ONLY be built on macOS (signing/dmg
# tooling), and Linux AppImage/deb want real Linux (symlinks, fpm) - so each
# OS builds its own, from the same tag, the same source.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
          # arm64 (Apple Silicon) runner: builds the .dmg mac guests want.
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # serialport is a CLI-only OPTIONAL dep; the app ships zero native
      # modules (Web Serial on every OS), so CI skips it entirely - nothing
      # here can ever invoke a node-gyp cross-compile.
      - name: install
        run: npm ci --omit=optional --no-audit --no-fund

      - name: build
        run: npx electron-builder ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/*.dmg
            dist/*.zip
            !dist/builder-debug.yml
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.tar.gz
            artifacts/*.dmg
            artifacts/*.zip
