# Ship the binaries for every platform.
#
# Triggers: pushing a version tag (v1.2.3...) publishes a GitHub Release with
# all artifacts attached; the Actions tab's "Run workflow" button builds
# artifacts for testing without a release.
#
# Why a matrix: macOS binaries can ONLY be built on macOS (signing/dmg
# tooling), and Linux AppImage/deb want real Linux (symlinks, fpm) - so each
# OS builds its own, from the same tag, the same source.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
          # arm64 (Apple Silicon) runner: builds the .dmg mac guests want.
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    # secrets is not a legal context in step-level if: expressions, so the
    # Apple material is lifted to job env (legal) and the build step branches
    # on the env context (legal in step if:). The values are only ever handed
    # to electron-builder by the signed step, below.
    env:
      MAC_SIGN_P12: ${{ secrets.MAC_CERT_P12 }}
      MAC_SIGN_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_ID_VALUE: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_VALUE: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # serialport is a CLI-only OPTIONAL dep; the app ships zero native
      # modules (Web Serial on every OS), so CI skips it entirely - nothing
      # here can ever invoke a node-gyp cross-compile.
      - name: install
        run: npm ci --omit=optional --no-audit --no-fund

      - name: build (mac signed + notarized)
        # The Apple env vars exist ONLY when the signing secret exists:
        # electron-builder v26 reads an EMPTY CSC_LINK as a certificate path
        # (the empty string resolves against the project dir -> 'not a file',
        # a dead mac build - measured on v0.11.4's run). Anvil's fallback
        # relied on 'empty means absent', which v26 grants for the APPLE_*
        # family but NOT for CSC_LINK. So: no secret, no vars - a clean
        # unsigned build via documented auto-discovery skip; secret, full
        # sign + notarize.
        if: ${{ matrix.args == '--mac' && env.MAC_SIGN_P12 != '' }}
        run: npx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ env.MAC_SIGN_P12 }}
          CSC_KEY_PASSWORD: ${{ env.MAC_SIGN_PASSWORD }}
          APPLE_ID: ${{ env.APPLE_ID_VALUE }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ env.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_VALUE }}
      - name: "build (unsigned: no mac secret, or not the mac job)"
        # --publish never: building on a v-tag makes electron-builder v26
        # try to publish a GitHub release itself (needs GH_TOKEN, exits 1,
        # poisons the job, release job never runs - measured on v0.11.3).
        # The release is this workflow's business, not electron-builder's.
        if: ${{ !(matrix.args == '--mac' && env.MAC_SIGN_P12 != '') }}
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Explicit, so a pre-seeded runner can't auto-discover some other
          # identity and ship a build signed by a cert this repo never set.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/*.dmg
            dist/*.zip
            !dist/builder-debug.yml
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.tar.gz
            artifacts/*.dmg
            artifacts/*.zip
