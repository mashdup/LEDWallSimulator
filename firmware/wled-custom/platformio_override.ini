; LED curtain wall — custom WLED build.
; ------------------------------------------------------------------------------
; Overlay file. setup.sh copies this to wled/platformio_override.ini and
; wled-custom/wled00/usermod.cpp to wled/wled00/usermod.cpp.
;
; Board: ESP32-S3 DevKitC-1. `esptool flash-id` on this unit reports
;   Chip type : ESP32-S3 (QFN56) rev v0.2
;   Features  : Embedded PSRAM 8MB (AP_3v3)      -> octal PSRAM
;   Flash     : Manufacturer 68, Device 4018, 16MB, quad (4 data lines)
; so: qio flash, opi PSRAM, 16MB. Memory type / flash size MUST match or the
; bootloader SHA-256 checks fail and the board reset-loops (see
; firmware/README.md, "Flashing someone else's merged image").
;
; Two transports, one protocol. Both compile out Adalight so usermod.cpp owns
; Serial, and both speak the 0xA5/0xA4 records from core/frame.js:
;
;   led_wall_s3_uart  RECOMMENDED. Serial is UART0 -> the CH9102F bridge.
;                     Put the cable in the board's UART port. A real UART has a
;                     real FIFO and no native-USB CDC, so the S3 byte-loss bug
;                     (espressif/arduino-esp32#9378) never applies.
;   led_wall_s3_usb   Serial is the S3's own USB-OTG (the port in use today,
;                     COM6 VID_303A&PID_1001). Convenient, but this is the
;                     transport the bytes are lost on; the robust framing caps a
;                     lost byte at one frame instead of a corrupted run.
;
; Panel defaults are baked in so a wiped config still lights correctly:
;   GPIO21, 400 LEDs, APA106/PL9823, BGR — read out of the WLED config that
;   drove this panel before (hardware/README "Panel identity").

[led_wall_common]
build_flags =
  ${common.build_flags} ${esp32s3.build_flags}
  -D WLED_RELEASE_NAME=\"LED_WALL\"
  -D CONFIG_LITTLEFS_FOR_IDF_3_2 -D WLED_WATCHDOG_TIMEOUT=0
  -D BOARD_HAS_PSRAM
  ; WLED keeps its own Adalight/TPM2/Improv/Serial-JSON reader on this port. The
  ; wall protocol is a different framing, so compile the Adalight reader out and
  ; let usermod.cpp own Serial. Saves ~5 KB and removes any second reader.
  -D WLED_DISABLE_ADALIGHT
  ; Panel (defaults only — WLED's stored config wins when present)
  -D DATA_PINS=21
  -D PIXEL_COUNTS=400
  -D LED_TYPES=TYPE_APA106
  -D DEFAULT_LED_COLOR_ORDER=COL_ORDER_BGR
  -D STATUSLED=-1
  ; Sink tunables (see usermod.cpp)
  -D LED_WALL_LED_COUNT=400
  -D LED_WALL_CHANNEL_MA=20
  -D LED_WALL_DEFAULT_LIMIT_MA=8000
  -D LED_WALL_PARTIAL_GAP_MS=40
  -D LED_WALL_MAX_REWINDS=8
  -D LED_WALL_RX_BUFFER=8192
lib_deps = ${esp32s3.lib_deps}
board_build.partitions = ${esp32.extreme_partitions}
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_filters = esp32_exception_decoder


[env:led_wall_s3_uart]
; Serial on UART0 (GPIO43/44) -> CH9102F. Cable in the UART port.
extends = env:esp32s3dev_16MB_opi
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
upload_speed = 921600
build_flags =
  ${led_wall_common.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=0
platform = ${esp32s3.platform}
platform_packages = ${esp32s3.platform_packages}


[env:led_wall_s3_usb]
; Serial on the S3's own USB-OTG (TinyUSB). Cable in the USB port (COM6 today).
extends = env:esp32s3dev_16MB_opi
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
upload_speed = 921600
build_flags =
  ${led_wall_common.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MODE=1
platform = ${esp32s3.platform}
platform_packages = ${esp32s3.platform_packages}
